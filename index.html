<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Builders Digest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f0f0f4;
    color: #1a1a1a;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
    padding: 48px 32px 40px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -50px; right: 100px;
    width: 140px; height: 140px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .header-label {
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header h1 {
    color: #fff;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .header-sub {
    color: rgba(255,255,255,0.75);
    font-size: 15px;
    margin-top: 8px;
  }
  .header-nav {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .lang-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-btn:hover, .lang-btn.active {
    background: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.4);
  }

  /* Date section */
  .date-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .date-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 36px 0 20px;
  }
  .date-dot {
    width: 10px; height: 10px;
    background: #6366f1;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .date-label {
    font-size: 18px;
    font-weight: 700;
    color: #374151;
  }
  .date-line {
    flex: 1;
    height: 1px;
    background: #ddd;
  }

  /* Section tag */
  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    margin: 20px 0 16px;
  }
  .section-tag.x { background: #14171a; }
  .section-tag.podcast { background: #e44d26; }
  .section-tag img {
    width: 16px; height: 16px;
    border-radius: 3px;
  }

  /* Masonry grid */
  .card-grid {
    columns: 3;
    column-gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }
  @media (max-width: 900px) { .card-grid { columns: 2; } }
  @media (max-width: 560px) { .card-grid { columns: 1; } }

  /* Card */
  .card {
    break-inside: avoid;
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
  .card-author {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
  }
  .card-role {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 10px;
  }
  .card-body-en {
    font-size: 14px;
    line-height: 1.65;
    color: #374151;
    margin-bottom: 8px;
  }
  .card-body-zh {
    font-size: 13px;
    line-height: 1.65;
    color: #666;
    border-top: 1px dashed #eee;
    padding-top: 8px;
    margin-bottom: 8px;
  }
  .card-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .card-link {
    display: inline-block;
    font-size: 12px;
    color: #6366f1;
    text-decoration: none;
    border: 1px solid #e0e0ff;
    border-radius: 20px;
    padding: 3px 12px;
    transition: background 0.2s;
  }
  .card-link:hover {
    background: #f0f0ff;
  }
  .card-time {
    font-size: 11px;
    color: #bbb;
    margin-top: 8px;
  }

  /* Podcast card */
  .card.podcast-card {
    border-left: 4px solid #e44d26;
  }
  .card-podcast-title {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .card-takeaway {
    background: linear-gradient(135deg, #f0f0ff, #f5f0ff);
    border-left: 3px solid #6366f1;
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    color: #312e81;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .card-takeaway-zh {
    color: #5b5299;
    font-weight: 400;
    display: block;
    margin-top: 6px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 40px 24px;
    color: #9ca3af;
    font-size: 13px;
  }
  .footer span { color: #6366f1; font-weight: 600; }

  /* Language visibility */
  .lang-en { display: block; }
  .lang-zh { display: none; }
  body.show-zh .lang-zh { display: block; }
  body.show-en .lang-en { display: block; }
  body.hide-en .lang-en { display: none; }
</style>
</head>
<body class="show-en show-zh">

<div class="header">
  <div class="header-inner">
    <div class="header-label">Daily Briefing</div>
    <h1>AI Builders Digest</h1>
    <div class="header-sub">Follow Builders, Not Influencers</div>
    <div class="header-nav">
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="lang-btn active" data-lang="both" onclick="setLang('both')">EN / ZH</button>
      <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">ZH</button>
    </div>
  </div>
</div>

<div id="content"></div>

<div class="footer">
  <span>Follow Builders, Not Influencers</span>
</div>

<script>
const DATA_DIR = 'data/';
const EXCLUDE_HANDLES = ['zarazhangrui'];

let currentLang = 'both';
function setLang(lang) {
  currentLang = lang;
  document.body.className = '';
  if (lang === 'en') { document.body.classList.add('show-en'); }
  else if (lang === 'zh') { document.body.classList.add('show-zh', 'hide-en'); }
  else { document.body.classList.add('show-en', 'show-zh'); }
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

function extractRole(bio) {
  if (!bio) return '';
  const first = bio.split('\n')[0].trim();
  return first.length > 80 ? first.slice(0, 80) + '...' : first;
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const h = Math.floor((now - d) / 3600000);
  if (h < 1) return 'just now';
  if (h < 24) return h + 'h ago';
  const days = Math.floor(h / 24);
  return days + 'd ago';
}

function summarizeTweets(tweets) {
  if (!tweets || tweets.length === 0) return { text: '', url: '', time: '' };
  const sorted = [...tweets].sort((a, b) => (b.likes + b.retweets) - (a.likes + a.retweets));
  const top = sorted[0];
  const text = top.text.replace(/https:\/\/t\.co\/\S+/g, '').trim();
  return { text, url: top.url, time: top.createdAt };
}

function renderPodcast(podcast, digest, container) {
  const card = document.createElement('div');
  card.className = 'card podcast-card';

  const pd = digest && digest.podcasts && digest.podcasts[podcast.name];
  const enText = pd ? pd.en : '';
  const zhText = pd ? pd.zh : '';
  const takeawayEn = pd ? pd.takeaway_en : '';
  const takeawayZh = pd ? pd.takeaway_zh : '';

  let takeawayHtml = '';
  if (takeawayEn || takeawayZh) {
    takeawayHtml = `<div class="card-takeaway">
      ${takeawayEn ? `<span class="lang-en">${takeawayEn}</span>` : ''}
      ${takeawayZh ? `<span class="card-takeaway-zh lang-zh">${takeawayZh}</span>` : ''}
    </div>`;
  }

  card.innerHTML = `
    <div class="card-podcast-title">${podcast.name}</div>
    <div class="card-role">${podcast.title}</div>
    ${takeawayHtml}
    ${enText ? `<div class="card-body-en lang-en">${enText}</div>` : ''}
    ${zhText ? `<div class="card-body-zh lang-zh">${zhText}</div>` : ''}
    <div class="card-links">
      <a class="card-link" href="${podcast.url}" target="_blank">Watch Episode &rarr;</a>
    </div>
    <div class="card-time">${timeAgo(podcast.publishedAt)}</div>
  `;
  container.appendChild(card);
}

function renderBuilder(builder, digest, container) {
  const { text, url, time } = summarizeTweets(builder.tweets);
  if (!text) return;

  const bd = digest && digest.x && digest.x[builder.handle];
  const enText = bd ? bd.en : text;
  const zhText = bd ? bd.zh : '';

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="card-author">${builder.name}</div>
    <div class="card-role">${extractRole(builder.bio)}</div>
    <div class="card-body-en lang-en">${enText}</div>
    ${zhText ? `<div class="card-body-zh lang-zh">${zhText}</div>` : ''}
    <div class="card-links">
      <a class="card-link" href="${url}" target="_blank">View Post &rarr;</a>
    </div>
    <div class="card-time">${timeAgo(time)}</div>
  `;
  container.appendChild(card);
}

async function loadJSON(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function init() {
  const content = document.getElementById('content');

  const today = new Date();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }

  for (const day of days) {
    const data = await loadJSON(DATA_DIR + day + '.json');
    if (!data || data.status === 'error') continue;

    const digest = await loadJSON(DATA_DIR + day + '-digest.json');

    // Date header
    const dateSection = document.createElement('div');
    dateSection.className = 'date-section';
    const dateObj = new Date(day + 'T00:00:00');
    const dateLabel = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    dateSection.innerHTML = `<div class="date-header">
      <div class="date-dot"></div>
      <div class="date-label">${dateLabel}</div>
      <div class="date-line"></div>
    </div>`;
    content.appendChild(dateSection);

    // X section
    const xBuilders = (data.x || []).filter(b => !EXCLUDE_HANDLES.includes(b.handle));
    if (xBuilders.length > 0) {
      const tag = document.createElement('div');
      tag.className = 'date-section';
      tag.innerHTML = '<div class="section-tag x"><img src="https://abs.twimg.com/favicons/twitter.3.ico" width="16" height="16" alt="X"></div>';
      content.appendChild(tag);

      const grid = document.createElement('div');
      grid.className = 'card-grid';
      const shuffled = [...xBuilders].sort(() => Math.random() - 0.5);
      shuffled.forEach(b => renderBuilder(b, digest, grid));
      content.appendChild(grid);
    }

    // Podcast section
    if (data.podcasts && data.podcasts.length > 0) {
      const tag = document.createElement('div');
      tag.className = 'date-section';
      tag.innerHTML = '<div class="section-tag podcast">&#127897; PODCASTS</div>';
      content.appendChild(tag);

      const grid = document.createElement('div');
      grid.className = 'card-grid';
      data.podcasts.forEach(p => renderPodcast(p, digest, grid));
      content.appendChild(grid);
    }
  }

  // Apply initial language
  setLang('both');
}

init();
</script>
</body>
</html>
