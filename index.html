<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Builders Digest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* Banner */
  .banner {
    background: #f5c542;
    padding: 60px 40px 50px;
    position: relative;
    overflow: hidden;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 1400px;
    margin: 24px auto;
    border-radius: 28px;
    margin-left: 40px;
    margin-right: 40px;
  }
  @media (min-width: 1480px) {
    .banner { margin-left: auto; margin-right: auto; }
  }
  .banner-shapes { position: absolute; inset: 0; pointer-events: none; }
  /* Decorative shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
  }
  .s1 { width: 90px; height: 90px; border: 6px solid #e85d3a; top: 20px; left: 6%; animation: float1 6s ease-in-out infinite; }
  .s2 { width: 50px; height: 50px; border: 5px solid #e85d3a; top: 35px; left: 8%; animation: float1 6s ease-in-out infinite 0.5s; }
  .s3 { width: 120px; height: 40px; background: #1a8a6a; border-radius: 30px; transform: rotate(-30deg); top: 60px; left: 30%; animation: drift 8s ease-in-out infinite; }
  .s4 { width: 80px; height: 80px; background: #e85d3a; border-radius: 50% 50% 50% 0; top: 55%; left: 15%; opacity: 0.9; animation: float2 7s ease-in-out infinite 1s; }
  .s5 { width: 100px; height: 70px; background: #f0a0c0; border-radius: 4px; transform: rotate(8deg); top: 50%; right: 8%; animation: wobble 9s ease-in-out infinite; }
  .s6 { width: 30px; height: 30px; background: #6366f1; top: 25%; left: 50%; animation: spin 12s linear infinite; }
  .s7 { width: 14px; height: 14px; background: #fff; border-radius: 50%; top: 70%; left: 40%; animation: pulse 3s ease-in-out infinite; }
  .s8 { width: 10px; height: 10px; background: #1a8a6a; border-radius: 50%; top: 30%; right: 30%; animation: pulse 4s ease-in-out infinite 1s; }
  .s9 { width: 60px; height: 60px; border: 5px solid #6366f1; border-radius: 0; top: 15%; right: 12%; opacity: 0.5; animation: spin 20s linear infinite reverse; }
  .s10 { width: 80px; height: 30px; background: #1a8a6a; border-radius: 0 0 50px 50px; top: 45%; left: 42%; animation: float2 6s ease-in-out infinite 2s; }
  .s11 { width: 40px; height: 40px; background: #f5c542; border: 4px solid #1a1a1a; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); top: 10%; right: 5%; animation: twinkle 4s ease-in-out infinite; }
  .s12 { width: 35px; height: 35px; background: #1a1a1a; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); bottom: 25%; left: 5%; animation: twinkle 5s ease-in-out infinite 2s; }
  .s13 { width: 70px; height: 8px; background: #1a1a1a; border-radius: 4px; bottom: 20%; right: 25%; animation: drift 10s ease-in-out infinite 1s; }
  .s14 { width: 8px; height: 8px; background: #1a1a1a; border-radius: 50%; bottom: 35%; right: 15%;
    box-shadow: 12px -8px 0 #1a1a1a, 24px 0px 0 #1a1a1a, 36px -8px 0 #1a1a1a;
    animation: float1 5s ease-in-out infinite 3s; }

  @keyframes float1 {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translateY(0) translateX(0); }
    33% { transform: translateY(-8px) translateX(5px); }
    66% { transform: translateY(4px) translateX(-3px); }
  }
  @keyframes drift {
    0%, 100% { transform: translateX(0) rotate(-20deg); }
    50% { transform: translateX(15px) rotate(-10deg); }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(8deg) scale(1); }
    50% { transform: rotate(-4deg) scale(1.03); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.6; }
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(0.7) rotate(20deg); opacity: 0.5; }
  }

  .banner-content {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .banner h1 {
    font-size: 52px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.15;
    letter-spacing: -2px;
  }
  .banner-sub {
    font-size: 16px;
    color: rgba(0,0,0,0.55);
    margin-top: 10px;
    font-weight: 500;
  }
  @media (max-width: 600px) {
    .banner { padding: 40px 20px 36px; min-height: 200px; }
    .banner h1 { font-size: 32px; }
  }

  /* Masonry grid */
  .grid {
    columns: 4;
    column-gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 40px;
  }
  @media (max-width: 1100px) { .grid { columns: 3; } }
  @media (max-width: 780px) { .grid { columns: 2; padding: 0 16px; } }
  @media (max-width: 500px) { .grid { columns: 1; } }

  /* Card */
  .card {
    break-inside: avoid;
    background: #fff;
    border-radius: 20px;
    margin-bottom: 20px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.1);
  }

  /* Avatar header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px 0;
  }
  .card-avatar {
    width: 44px; height: 44px;
    border-radius: 14px;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
  }
  .card-author {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.3;
  }
  .card-role {
    font-size: 11px;
    color: #aaa;
    margin-top: 1px;
    line-height: 1.3;
  }

  /* Card body */
  .card-content {
    padding: 14px 20px 6px;
  }
  .card-body-en {
    font-size: 14px;
    line-height: 1.7;
    color: #374151;
  }
  .card-body-zh {
    font-size: 13px;
    line-height: 1.7;
    color: #888;
    margin-top: 10px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 18px;
  }
  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-tag {
    font-size: 11px;
    color: #999;
    background: #f5f5f5;
    padding: 3px 10px;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .card-tag:hover { background: #eee; }
  a.card-tag { color: #6366f1; }
  .card-time {
    font-size: 11px;
    color: #ccc;
  }

  /* Featured image area (for cards with images) */
  .card-image {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    display: block;
  }

  /* Podcast card */
  .card-podcast .card-accent {
    background: linear-gradient(135deg, #1a1a2e, #2d2b55);
    padding: 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .card-podcast .card-accent::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .card-podcast-icon {
    font-size: 28px;
    margin-bottom: 10px;
  }
  .card-podcast-name {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
  }
  .card-podcast-title {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }
  .card-takeaway {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 14px;
  }
  .card-takeaway p {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    line-height: 1.5;
  }
  .card-takeaway .zh {
    font-weight: 400;
    opacity: 0.75;
    display: block;
    margin-top: 6px;
  }

  /* Date divider */
  .date-divider {
    max-width: 1400px;
    margin: 10px auto 24px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .date-divider-text {
    font-size: 13px;
    font-weight: 600;
    color: #bbb;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .date-divider-line {
    flex: 1;
    height: 1px;
    background: #e5e5e5;
  }

  /* Section label */
  .section-label {
    max-width: 1400px;
    margin: 0 auto 16px;
    padding: 0 40px;
  }
  .section-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .section-pill.x {
    background: #1a1a1a;
    color: #fff;
  }
  .section-pill.podcast {
    background: #e44d26;
    color: #fff;
  }
  .section-pill img {
    width: 14px; height: 14px;
    border-radius: 3px;
  }

  /* Floating bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 32px;
    padding: 6px;
    display: flex;
    gap: 4px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
    z-index: 100;
  }
  .bottom-btn {
    background: transparent;
    border: none;
    padding: 10px 22px;
    border-radius: 26px;
    font-size: 13px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .bottom-btn:hover { color: #1a1a1a; }
  .bottom-btn.active {
    background: #1a1a1a;
    color: #fff;
  }

  /* Language visibility */
  .lang-en { display: block; }
  .lang-zh { display: none; }
  body.show-zh .lang-zh { display: block; }
  body.show-en .lang-en { display: block; }
  body.hide-en .lang-en { display: none; }
</style>
</head>
<body class="show-en show-zh">

<div class="banner">
  <div class="banner-shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>
    <div class="shape s9"></div>
    <div class="shape s10"></div>
    <div class="shape s11"></div>
    <div class="shape s12"></div>
    <div class="shape s13"></div>
    <div class="shape s14"></div>
  </div>
  <div class="banner-content">
    <h1>AI Builders<br>Digest</h1>
    <div class="banner-sub">Follow Builders, Not Influencers</div>
  </div>
</div>

<div id="content"></div>

<div class="bottom-nav">
  <button class="bottom-btn" data-lang="en" onclick="setLang('en')">English</button>
  <button class="bottom-btn active" data-lang="both" onclick="setLang('both')">Bilingual</button>
  <button class="bottom-btn" data-lang="zh" onclick="setLang('zh')">Chinese</button>
</div>

<script>
const DATA_DIR = 'data/';
const EXCLUDE_HANDLES = ['zarazhangrui'];

let currentLang = 'both';
function setLang(lang) {
  currentLang = lang;
  document.body.className = '';
  if (lang === 'en') document.body.classList.add('show-en');
  else if (lang === 'zh') document.body.classList.add('show-zh', 'hide-en');
  else document.body.classList.add('show-en', 'show-zh');
  document.querySelectorAll('.bottom-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

function extractRole(bio) {
  if (!bio) return '';
  const first = bio.split('\n')[0].trim();
  return first.length > 60 ? first.slice(0, 60) + '...' : first;
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const h = Math.floor((now - d) / 3600000);
  if (h < 1) return 'just now';
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function summarizeTweets(tweets) {
  if (!tweets || tweets.length === 0) return { text: '', url: '', time: '' };
  const sorted = [...tweets].sort((a, b) => (b.likes + b.retweets) - (a.likes + a.retweets));
  const top = sorted[0];
  return { text: top.text.replace(/https:\/\/t\.co\/\S+/g, '').trim(), url: top.url, time: top.createdAt };
}

function avatarUrl(handle) {
  return `https://unavatar.io/x/${handle}`;
}

function renderPodcast(podcast, digest, container) {
  const card = document.createElement('div');
  card.className = 'card card-podcast';

  const pd = digest && digest.podcasts && digest.podcasts[podcast.name];
  const enText = pd ? pd.en : '';
  const zhText = pd ? pd.zh : '';
  const takeawayEn = pd ? pd.takeaway_en : '';
  const takeawayZh = pd ? pd.takeaway_zh : '';

  let takeawayHtml = '';
  if (takeawayEn || takeawayZh) {
    takeawayHtml = `<div class="card-takeaway">
      ${takeawayEn ? `<p class="lang-en">${takeawayEn}</p>` : ''}
      ${takeawayZh ? `<p><span class="zh lang-zh">${takeawayZh}</span></p>` : ''}
    </div>`;
  }

  card.innerHTML = `
    <div class="card-accent">
      <div class="card-podcast-icon">&#127897;</div>
      <div class="card-podcast-name">${podcast.name}</div>
      <div class="card-podcast-title">${podcast.title}</div>
      ${takeawayHtml}
    </div>
    <div class="card-content">
      ${enText ? `<div class="card-body-en lang-en">${enText}</div>` : ''}
      ${zhText ? `<div class="card-body-zh lang-zh">${zhText}</div>` : ''}
    </div>
    <div class="card-footer">
      <div class="card-tags">
        <a class="card-tag" href="${podcast.url}" target="_blank">Watch Episode</a>
      </div>
      <span class="card-time">${timeAgo(podcast.publishedAt)}</span>
    </div>
  `;
  container.appendChild(card);
}

function renderBuilder(builder, digest, container) {
  const { text, url, time } = summarizeTweets(builder.tweets);
  if (!text) return;

  const bd = digest && digest.x && digest.x[builder.handle];
  const enText = bd ? bd.en : text;
  const zhText = bd ? bd.zh : '';

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="card-header">
      <img class="card-avatar" src="${avatarUrl(builder.handle)}" alt="${builder.name}" onerror="this.style.display='none'">
      <div>
        <div class="card-author">${builder.name}</div>
        <div class="card-role">${extractRole(builder.bio)}</div>
      </div>
    </div>
    <div class="card-content">
      <div class="card-body-en lang-en">${enText}</div>
      ${zhText ? `<div class="card-body-zh lang-zh">${zhText}</div>` : ''}
    </div>
    <div class="card-footer">
      <div class="card-tags">
        <a class="card-tag" href="${url}" target="_blank">View Post</a>
      </div>
      <span class="card-time">${timeAgo(time)}</span>
    </div>
  `;
  container.appendChild(card);
}

async function loadJSON(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function init() {
  const content = document.getElementById('content');
  const today = new Date();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }

  for (const day of days) {
    const data = await loadJSON(DATA_DIR + day + '.json');
    if (!data || data.status === 'error') continue;
    const digest = await loadJSON(DATA_DIR + day + '-digest.json');

    const dateObj = new Date(day + 'T00:00:00');
    const dateLabel = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    const divider = document.createElement('div');
    divider.className = 'date-divider';
    divider.innerHTML = `<span class="date-divider-text">${dateLabel}</span><div class="date-divider-line"></div>`;
    content.appendChild(divider);

    const xBuilders = (data.x || []).filter(b => !EXCLUDE_HANDLES.includes(b.handle));
    if (xBuilders.length > 0) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.innerHTML = '<span class="section-pill x"><img src="https://abs.twimg.com/favicons/twitter.3.ico" width="14" height="14" alt="X"></span>';
      content.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'grid';
      const shuffled = [...xBuilders].sort(() => Math.random() - 0.5);
      shuffled.forEach(b => renderBuilder(b, digest, grid));
      content.appendChild(grid);
    }

    if (data.podcasts && data.podcasts.length > 0) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.style.marginTop = '28px';
      label.innerHTML = '<span class="section-pill podcast">&#127897; Podcasts</span>';
      content.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'grid';
      data.podcasts.forEach(p => renderPodcast(p, digest, grid));
      content.appendChild(grid);
    }
  }

  setLang('both');
}

init();
</script>
</body>
</html>
